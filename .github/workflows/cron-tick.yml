name: pipeline-tick

# PLAN.md faz 7 alternatifi: cron makine yerine GitHub Actions'ta koşar.
# Saatler cron.ts varsayılanıyla aynı: 07:00 ve 19:00 Europe/Istanbul (=04:00/16:00 UTC).
# Gerekli repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GCP_SA_KEY.
# GCP_SA_KEY = "Vertex AI User" rollü service account'un JSON anahtarı (tamamı).
# Lokaldeki gibi Vertex/ADC kullanılır → kullanım GCP $300 kredisinden düşer.
# (Eski AI Studio key yolu kaldırıldı: proje kredisi bitti, key tipi karmaşası vardı.)
on:
  schedule:
    - cron: "0 4,16 * * *"
  workflow_dispatch: {}

concurrency:
  group: pipeline-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vertex ADC: JSON anahtarı geçici dosyaya yazar, GOOGLE_APPLICATION_CREDENTIALS'ı
      # sonraki adımlara export eder — @google/genai bunu otomatik bulur.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # worker, core'u dist/ üzerinden import eder — temiz checkout'ta önce derlenmeli.
      - run: pnpm --filter @idea-factory/core build

      - name: tick (topla → zenginleştir → ön-ele → analiz → digest)
        run: pnpm tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANALYSIS_PROVIDER: gemini
          # Varsayılan 25/10 ingest hızına yetişmiyordu (enrich backlog birikiyordu).
          # Yükseltildi; concurrency düşük tutuluyor (Vertex 429 önlemi).
          ENRICH_LIMIT: ${{ vars.ENRICH_LIMIT || '100' }}
          # Ön-eleme ucuz+hızlı — enrich ile aynı ölçekte, analyze'ın önündeki tüm backlog'u kapsasın.
          TRIAGE_LIMIT: ${{ vars.TRIAGE_LIMIT || '100' }}
          ANALYZE_LIMIT: ${{ vars.ANALYZE_LIMIT || '40' }}
          ANALYZE_PER_SOURCE_CAP: ${{ vars.ANALYZE_PER_SOURCE_CAP || '12' }}
          # Yorumcu kapısı (FAZ6_PLAN.md §Faz 2): her AI-kovala adayı 2 bağımsız tartışmadan
          # geçer. TUR tavanı (sinyal değil) — günde ~2.3 aday x 2 tur + birikmiş kuyruk payı.
          DEBATE_AUTO_LIMIT: ${{ vars.DEBATE_AUTO_LIMIT || '8' }}
          # Asılan LLM bağlantısı tick'i sonsuza kadar bekletmesin.
          LLM_TIMEOUT_MS: ${{ vars.LLM_TIMEOUT_MS || '90000' }}
          ANALYZE_DEADLINE_MS: ${{ vars.ANALYZE_DEADLINE_MS || '240000' }}
          DEBATE_DEADLINE_MS: ${{ vars.DEBATE_DEADLINE_MS || '300000' }}
          # Grounding: yalnız `lenses.grounding = true` merceklerde (0015 → beyaz-alan).
          GROUNDING_ENABLED: ${{ vars.GROUNDING_ENABLED || 'false' }}
          GROUNDING_TIMEOUT_MS: ${{ vars.GROUNDING_TIMEOUT_MS || '30000' }}
          GEMINI_USE_VERTEX: "true"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || 'idea-factory-502619' }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
          # Lokal Vertex'te kanıtlanmış model (3.5-flash Vertex projesinde yoktu).
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

      # Digest runner diskinde kalıyordu, koşu bitince siliniyordu — artifact olarak sakla.
      # if: always() → tick kırmızıysa bile o ana kadar yazılan digest kaybolmasın.
      - name: digest'i artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/*.md
          if-no-files-found: ignore
          retention-days: 30
